# tmux colors: GitHub Light Default (Primer), matching Ghostty theme github-light-bart and nvim github_light_default.
# Loaded by tmux.conf and by the `theme` shell function when switching to light.
#   accent #0969da   text #1f2328   muted #656d76   border #d0d7de   overlay #f6f8fa

# Muted grey for separators (status-left in tmux.conf, claude-usage.sh)
set -g @muted "#656d76"

set -g pane-border-style "bg=default,fg=#d0d7de"
set -g pane-active-border-style "bg=default,fg=#d0d7de"
set -g pane-border-format "#{?pane_active,#[fg=#1f2328],#[fg=#656d76]} #T #[default]"

set -g message-style "bg=#f6f8fa,fg=#1f2328"
set -g message-command-style "bg=#f6f8fa,fg=#1f2328"
set -g mode-style "bg=#0969da,fg=#ffffff"

set -g status-style "bg=default,fg=#0969da"
set -g status-left-style "bg=default,fg=#0969da"
set -g status-right-style "bg=default,fg=#0969da"
set -g window-status-style "bg=default,fg=#656d76"
set -g window-status-current-style "bg=default,fg=#0969da,bold"
