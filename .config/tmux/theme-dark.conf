# tmux colors: GitHub Dark Default (Primer), same as Ghostty theme and nvim github_dark_default.
# Loaded by tmux.conf and by the `theme` shell function when switching to dark.
# Hex instead of names like "cyan", so it doesn't depend on the terminal's ANSI palette.
#   accent #58a6ff   text #e6edf3   muted #7d8590   border #30363d   overlay #161b22

# Muted grey for separators (status-left in tmux.conf, claude-usage.sh)
set -g @muted "#7d8590"

set -g pane-border-style "bg=default,fg=#30363d"
set -g pane-active-border-style "bg=default,fg=#30363d"
set -g pane-border-format "#{?pane_active,#[fg=#e6edf3],#[fg=#7d8590]} #T #[default]"

set -g message-style "bg=#161b22,fg=#e6edf3"
set -g message-command-style "bg=#161b22,fg=#e6edf3"
set -g mode-style "bg=#1f6feb,fg=#ffffff"

set -g status-style "bg=default,fg=#58a6ff"
set -g status-left-style "bg=default,fg=#58a6ff"
set -g status-right-style "bg=default,fg=#58a6ff"
set -g window-status-style "bg=default,fg=#7d8590"
set -g window-status-current-style "bg=default,fg=#58a6ff,bold"
